<section id="tab-calendario" class="module-section active">
  <header class="module-header">
    <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
      <div>
        <h2><i data-lucide="calendar"></i> Calendario Integrado</h2>
        <p>Visualiza y navega por tus actividades y tareas registradas en vistas Mensual, Diaria y Anual.</p>
      </div>
      <div class="calendar-controls">
        <div class="view-switch-group">
          <button class="btn-toggle active" data-view="month" onclick="switchCalendarView('month')">Mes</button>
          <button class="btn-toggle" data-view="day" onclick="switchCalendarView('day')">Día</button>
          <button class="btn-toggle" data-view="year" onclick="switchCalendarView('year')">Año</button>
        </div>
      </div>
    </div>
  </header>

  <div class="module-body">
    <div class="calendar-card">
      
      <!-- BARRA SUPERIOR DE NAVEGACIÓN DE FECHAS -->
      <div class="calendar-nav-bar">
        <div class="nav-buttons">
          <button class="btn btn-ghost btn-icon" onclick="navigateCalendar(-1)">
            <i data-lucide="chevron-left"></i>
          </button>
          <button class="btn btn-ghost" onclick="navigateCalendarToToday()">Hoy</button>
          <button class="btn btn-ghost btn-icon" onclick="navigateCalendar(1)">
            <i data-lucide="chevron-right"></i>
          </button>
        </div>
        <h3 id="calendar-current-label" class="calendar-title">Cargando...</h3>
      </div>

      <!-- CONTENEDOR DINÁMICO DE VISTAS -->
      <div id="calendar-view-container" class="calendar-view-container">
        <!-- El contenido se genera automáticamente desde calendario.js -->
      </div>

    </div>
  </div>
</section>

<!-- MODAL DETALLE DE ACTIVIDAD/TAREA -->
<div class="modal-overlay" id="calendar-event-modal">
  <div class="modal-card">
    <div class="modal-header">
      <h3 id="cal-modal-title"><i data-lucide="info"></i> Detalle del Evento</h3>
      <button class="btn-close" onclick="closeCalendarModal()"><i data-lucide="x"></i></button>
    </div>
    <div class="modal-body-content" id="cal-modal-content">
      <!-- Información inyectada por JS -->
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" onclick="closeCalendarModal()">Cerrar</button>
    </div>
  </div>
</div>
