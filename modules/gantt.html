<section id="tab-gantt" class="module-section active">
  <header class="module-header">
    <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
      <div>
        <h2><i data-lucide="folder-kanban"></i> Gestión Integral de Proyectos</h2>
        <p>Planifica, ejecuta y gestiona tus proyectos desde la idea inicial hasta la entrega final.</p>
      </div>
      <button class="btn btn-primary" style="width: auto;" onclick="openProjectModal()">
        <i data-lucide="folder-plus"></i> Nuevo Proyecto
      </button>
    </div>
  </header>

  <div class="module-body">
    <!-- PANEL DE MÉTRICAS GLOBALES -->
    <section class="stats-panel">
      <div class="stat-card">
        <span class="stat-label">Proyectos Activos</span>
        <span class="stat-value" id="proj-stat-active">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Progreso Promedio</span>
        <span class="stat-value" id="proj-stat-progress">0%</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Completados</span>
        <span class="stat-value" id="proj-stat-done">0</span>
      </div>
    </section>

    <!-- LISTA DE PROYECTOS EN CURSO -->
    <div id="projects-container" class="projects-grid">
      <!-- Inyectado dinámicamente desde gantt.js -->
    </div>
  </div>
</section>

<!-- MODAL CREAR / EDITAR PROYECTO -->
<div class="modal-overlay" id="project-modal">
  <div class="modal-card">
    <div class="modal-header">
      <h3 id="modal-project-title"><i data-lucide="folder-plus"></i> Gestionar Proyecto</h3>
      <button class="btn-close" onclick="closeProjectModal()"><i data-lucide="x"></i></button>
    </div>
    <form id="project-form" onsubmit="handleSaveProject(event)">
      <input type="hidden" id="project-id">

      <div class="form-group">
        <label for="project-name">Nombre del Proyecto</label>
        <input type="text" id="project-name" class="form-input" placeholder="Ej: Capstone Titulación, Rediseño Web" required>
      </div>

      <div class="form-group">
        <label for="project-desc">Objetivo / Descripción</label>
        <textarea id="project-desc" class="form-input" rows="2" placeholder="Breve alcance del proyecto..."></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="project-phase">Fase Actual</label>
          <select id="project-phase" class="form-input" required>
            <option value="1. Inicio & Planificación">1. Inicio & Planificación</option>
            <option value="2. En Desarrollo / Ejecución">2. En Desarrollo / Ejecución</option>
            <option value="3. Pruebas & Ajustes">3. Pruebas & Ajustes</option>
            <option value="4. Finalizado / Entregado">4. Finalizado / Entregado</option>
          </select>
        </div>
        <div class="form-group">
          <label for="project-progress">Progreso (%)</label>
          <input type="number" id="project-progress" class="form-input" min="0" max="100" value="0" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="project-start">Fecha Inicio</label>
          <input type="date" id="project-start" class="form-input" required>
        </div>
        <div class="form-group">
          <label for="project-deadline">Fecha Límite (Entrega)</label>
          <input type="date" id="project-deadline" class="form-input" required>
        </div>
      </div>

      <div class="modal-footer" style="justify-content: space-between;">
        <button type="button" class="btn btn-danger" id="btn-delete-project" onclick="handleDeleteProject()" style="display: none;">
          <i data-lucide="trash-2"></i> Eliminar
        </button>
        <div style="display: flex; gap: 8px; margin-left: auto;">
          <button type="button" class="btn btn-secondary" onclick="closeProjectModal()">Cancelar</button>
          <button type="submit" class="btn btn-primary" style="width: auto;">Guardar Proyecto</button>
        </div>
      </div>
    </form>
  </div>
</div>
