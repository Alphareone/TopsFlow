<section id="tab-horario" class="module-section active">
  <header class="module-header no-print">
    <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
      <div>
        <h2><i data-lucide="calendar"></i> Planificación Semestral Inteligente</h2>
        <p>Trabajos • Estudios • Prácticas</p>
      </div>
      <div class="header-controls">
        <button class="btn btn-pdf" onclick="window.print()">
          <i data-lucide="download"></i> Exportar PDF
        </button>
        <button class="btn btn-ghost" onclick="resetSchedule()">
          <i data-lucide="trash-2"></i> Limpiar
        </button>
      </div>
    </div>
  </header>

  <div class="module-body" id="pdf-export-area">
    <!-- PANEL DE ESTADÍSTICAS -->
    <section class="stats-panel">
      <div class="stat-card">
        <span class="stat-label">Total Bloques</span>
        <span class="stat-value" id="stat-total-blocks">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Horas Semanales Totales</span>
        <span class="stat-value" id="stat-total-hours">0 <small>hrs</small></span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Categorías Registradas</span>
        <span class="stat-value" id="stat-activity-count">0</span>
      </div>
    </section>

    <!-- DESGLOSE DE ACTIVIDADES -->
    <section class="breakdown-container">
      <h3 class="breakdown-title">
        <i data-lucide="pie-chart"></i> Desglose y Suma de Horas por Actividad Semestral
      </h3>
      <div class="breakdown-section" id="breakdown-panel"></div>
    </section>

    <!-- FORMULARIO Y TABLA DEL HORARIO -->
    <div class="main-layout">
      <aside class="form-card no-print" id="form-section">
        <div class="card-header">
          <i data-lucide="plus-circle"></i>
          <h2>Registrar Actividad</h2>
        </div>
        <form id="activity-form" onsubmit="handleAddActivity(event)">
          <div class="form-group">
            <label for="act-name">Nombre de la Actividad</label>
            <input type="text" id="act-name" class="form-input" placeholder="Ej: Pega Lopa, Capstone" list="activity-suggestions" required>
            <datalist id="activity-suggestions">
              <option value="Pega (Lopa)"></option>
              <option value="Estudios (Capstone)"></option>
              <option value="Práctica Profesional Remota"></option>
            </datalist>
          </div>

          <div class="form-group">
            <label for="act-day">Día de la semana</label>
            <select id="act-day" class="form-input" required>
              <option value="LUN">Lunes</option>
              <option value="MAR">Martes</option>
              <option value="MIÉ">Miércoles</option>
              <option value="JUE">Jueves</option>
              <option value="VIE">Viernes</option>
              <option value="SÁB">Sábado</option>
            </select>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="act-start">Hora Inicio</label>
              <select id="act-start" class="form-input" required></select>
            </div>
            <div class="form-group">
              <label for="act-end">Hora Fin</label>
              <select id="act-end" class="form-input" required></select>
            </div>
          </div>

          <div class="form-group">
            <label>Color Identificador</label>
            <div class="color-presets">
              <button type="button" class="preset-btn" style="background:#3b82f6;" onclick="setColor('#3b82f6')"></button>
              <button type="button" class="preset-btn" style="background:#10b981;" onclick="setColor('#10b981')"></button>
              <button type="button" class="preset-btn" style="background:#f59e0b;" onclick="setColor('#f59e0b')"></button>
              <button type="button" class="preset-btn" style="background:#ef4444;" onclick="setColor('#ef4444')"></button>
              <button type="button" class="preset-btn" style="background:#8b5cf6;" onclick="setColor('#8b5cf6')"></button>
            </div>
            <div class="color-picker-wrapper">
              <input type="color" id="act-color" class="color-input" value="#3b82f6">
              <span class="color-hint">Color personalizado</span>
            </div>
          </div>

          <button type="submit" class="btn btn-primary">
            <i data-lucide="plus"></i> Asignar al Horario
          </button>
        </form>
      </aside>

      <section class="schedule-card">
        <div class="schedule-scroll-wrapper">
          <table class="schedule-table">
            <thead>
              <tr>
                <th class="time-col"><i data-lucide="clock"></i></th>
                <th>LUN</th>
                <th>MAR</th>
                <th>MIÉ</th>
                <th>JUE</th>
                <th>VIE</th>
                <th>SÁB</th>
              </tr>
            </thead>
            <tbody id="schedule-body"></tbody>
          </table>
        </div>
      </section>
    </div>
  </div>
</section>

<!-- MODAL DE EDICIÓN DE BLOQUES -->
<div class="modal-overlay no-print" id="edit-modal">
  <div class="modal-card">
    <div class="modal-header">
      <h3><i data-lucide="edit-3"></i> Editar Bloque</h3>
      <button class="btn-close" onclick="closeEditModal()"><i data-lucide="x"></i></button>
    </div>
    <form id="edit-form" onsubmit="handleSaveEdit(event)">
      <input type="hidden" id="edit-id">
      <div class="form-group">
        <label for="edit-name">Nombre de la actividad</label>
        <input type="text" id="edit-name" class="form-input" required>
      </div>
      <div class="form-group">
        <label for="edit-color">Color</label>
        <input type="color" id="edit-color" class="color-input">
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-danger" onclick="handleDeleteActivity()">
          <i data-lucide="trash"></i> Eliminar
        </button>
        <button type="submit" class="btn btn-primary">
          Guardar Cambios
        </button>
      </div>
    </form>
  </div>
</div>
